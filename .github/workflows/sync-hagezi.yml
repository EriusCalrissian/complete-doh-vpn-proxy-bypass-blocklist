name: Sync Hagezi DoH lists

on:
  schedule:
    # Daily; lists themselves advertise Expires: 8 hours.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch + transform
        run: bash scripts/sync.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock dnsmasq wildcard rpz
          if git diff --staged --quiet; then
            echo "No list changes."
          else
            git commit -m "chore: sync hagezi lists + dnsbunker.org"
            git push
          fi
