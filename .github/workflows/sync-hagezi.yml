name: Sync Hagezi DoH lists

on:
  schedule:
    # Daily; upstream lists advertise Expires: 8 hours.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-hagezi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Required so git-auto-commit-action can push with GITHUB_TOKEN.
          persist-credentials: true

      - name: Fetch + transform
        run: bash scripts/sync.sh

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync hagezi lists + dnsbunker.org"
          file_pattern: adblock/* dnsmasq/* wildcard/* rpz/*
